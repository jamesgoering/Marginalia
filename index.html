<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1d22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Marginalia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>Marginalia</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--paper:#fff;--panel:#f6f7f9;--side:#eef0f3;--card:#fff;--ink:#1d1f24;--ink2:#444a55;--muted:#6f7580;--line:#e3e5ea;--line2:#cdd1d8;--accent:#3560e8;--tint:rgba(53,96,232,.12);--fill:#eceef2;--danger:#c8443f;--c1:#4c7af0;--c2:#dd5d62;--c3:#3fa874;--c4:#e5b72a;--c5:#ee8a3e;--c6:#8f78f0;--ui:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Source Serif 4",Georgia,serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1c1d22;--panel:#212228;--side:#18191d;--card:#26272e;--ink:#eceef2;--ink2:#c9cdd5;--muted:#9096a0;--line:#2f3037;--line2:#3e3f48;--accent:#8aa6ff;--tint:rgba(138,166,255,.17);--fill:#2b2c33;--danger:#f0868a;--c1:#7b9dff;--c2:#f0868a;--c3:#6fd0a0;--c4:#f2c94c;--c5:#f5a463;--c6:#b6a3fb;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1c1d22;--panel:#212228;--side:#18191d;--card:#26272e;--ink:#eceef2;--ink2:#c9cdd5;--muted:#9096a0;--line:#2f3037;--line2:#3e3f48;--accent:#8aa6ff;--tint:rgba(138,166,255,.17);--fill:#2b2c33;--danger:#f0868a;--c1:#7b9dff;--c2:#f0868a;--c3:#6fd0a0;--c4:#f2c94c;--c5:#f5a463;--c6:#b6a3fb;color-scheme:dark}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--ui);-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#app{display:flex;height:100%}
#side{display:none;width:256px;flex:none;background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:14px 12px 20px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{flex:none;display:flex;align-items:center;gap:8px;min-height:54px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
#body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;overscroll-behavior:contain}
#foot{flex:none}
#tabs{flex:none;display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--panel);padding:6px 4px 8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);min-width:66px;padding:2px 4px;text-align:center}
.tab.on{color:var(--accent);font-weight:600}
#app.focus #tabs,#app.focus #side{display:none!important}
@media (min-width:980px){#side{display:block}#tabs{display:none}.narrow{display:none!important}}

.sp{flex:1}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--ink2);flex:none}
.ib:active,.nav:active,.sl:active{background:var(--fill)}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:500;font-size:15px;padding:6px 4px;flex:none}
.bt{font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.mkb{display:flex;align-items:center;gap:6px;background:var(--fill);color:var(--ink2);padding:8px 13px;border-radius:10px;font-weight:500;font-size:14px;flex:none}
.mkb.on{background:var(--tint);color:var(--accent);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--tint);color:var(--accent);font-weight:600;font-size:14.5px;padding:10px 16px;border-radius:11px}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--fill);color:var(--ink2);font-weight:500;font-size:14.5px;padding:10px 15px;border-radius:11px}
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:3px}
.seg button{padding:6px 13px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.16)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.lbl{font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:4px}
.ser{font-size:12.5px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}

.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;padding:2px 8px 12px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:block;flex:none}
.brand .ib{margin-left:auto}
#side{transition:width .18s,padding .18s}
@media (min-width:980px){#app.noside #side{width:62px;padding:12px 8px}#app.noside #side .lab,#app.noside #side .sgrp,#app.noside #side .sli,#app.noside #side .sfoot,#app.noside .brand i{display:none}#app.noside .nav{justify-content:center;padding:10px 0}#app.noside .brand{justify-content:center;padding:2px 0 12px}#app.noside .brand .ib{margin:0}}
.fbar{display:flex;gap:2px;margin:0 0 6px}
.fbar button{width:36px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--ink2)}
.fbar button:active{background:var(--fill)}
.nb p{margin:0}.nb p+p{margin-top:4px}.nb ul,.nb ol{margin:2px 0;padding-left:20px}.nb mark{background:color-mix(in srgb,var(--c4) 40%,transparent);color:inherit;border-radius:2px}.nb h2,.nb h3,.nb h4{font-size:14px;margin:4px 0 2px}
.nc{cursor:pointer}
#app.novn .vt .vn,#tx.novn .vn{display:none}
.tfs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.tfs button{padding:9px 11px;border:1px solid var(--line2);border-radius:10px;font-size:16px}
.tfs button.on{border-color:var(--accent);background:var(--tint);color:var(--accent)}
.trw{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.trw input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.trw b{min-width:44px;text-align:right;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.tpv{background:var(--panel);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.aa{font:600 16px var(--serif);color:var(--ink2)}
.ind{display:inline-block}
.va{scroll-margin-top:20px}
.vrow.stz>.vt{padding-top:22px}
.rdt .vv{margin:0 0 8px}
.rdt .vv.stz{margin-top:20px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;color:var(--ink2);font-weight:500;font-size:14.5px}
.nav.on{background:var(--tint);color:var(--accent);font-weight:600}
.sgrp{font-size:12px;color:var(--muted);font-weight:500;margin:16px 10px 4px}
.sli{display:block;width:100%;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--ink2);margin-bottom:2px}
.sli small{display:block;font-size:12px;color:var(--muted)}
.sli.on{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:600}
.sfoot{margin:18px 10px 0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}

.pg{padding:16px;display:grid;gap:12px;max-width:980px;margin:0 auto}
.sl{display:block;width:100%;padding:13px 15px;border-radius:13px;background:var(--card);border:1px solid var(--line)}
.sl b{font:600 18px/1.3 var(--serif);display:block}
.sl span{font-size:13px;color:var(--muted)}
.ghead{font-size:13px;color:var(--muted);font-weight:600;margin:8px 2px -4px}

.shd{padding:18px 20px 4px;max-width:1100px}
.ttl{font:600 28px/1.15 var(--serif);margin:2px 0 0}
.ref{font:600 17px/1.4 var(--serif);margin-top:4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.trp{font:600 12px var(--ui);background:var(--fill);border-radius:7px;padding:2px 8px}
.sum{display:block;width:100%;margin-top:10px;font-size:14px;color:var(--ink2);background:var(--panel);border-radius:10px;padding:8px 12px}
.sum b{font-weight:600;margin-right:6px}
.sum.fold{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stabs{padding:12px 20px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 20px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;border:1px solid var(--line2);color:var(--ink2);border-radius:999px;padding:4px 11px;white-space:nowrap}
.chip.on{background:var(--tint);border-color:transparent;color:var(--accent);font-weight:600}
.hint{margin:4px 20px 8px;padding:8px 12px;border-radius:10px;background:var(--tint);color:var(--accent);font-size:13.5px}
.nh{display:none}
.vrow{padding:4px 20px;scroll-margin-top:20px}
.vrow.flash .vt{background:var(--tint);border-radius:6px}
.vt{font-family:var(--sfont,var(--serif));font-size:calc(17.5px*var(--tsz,1));line-height:var(--tlh,1.75);margin:0;transition:background .4s}
.vn{font:600 11px var(--ui);color:var(--accent);vertical-align:super;margin-right:4px;-webkit-user-select:none;user-select:none}
.vtx{-webkit-user-select:text;user-select:text}
.cards{display:grid;gap:6px;margin:6px 0 8px 14px}
.cards:empty{display:none}
.nc{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;line-height:1.45;transition:border-color .3s,box-shadow .3s}
.nc.flash{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
.nc span{display:block}
.nt{font-weight:600;font-size:12.5px}
.nt em{font-style:normal;color:var(--muted);font-weight:400;margin-left:6px}
.ntags{font-size:12px;color:var(--muted);margin-top:3px}
@media (min-width:680px){
 .nh{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,34%);padding:0 24px;border-bottom:1px solid var(--line)}
 .nh>div{padding:6px 0;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
 .nh>div+div{border-left:1px solid var(--line);padding-left:16px}
 .vrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,34%);padding:0 24px}
 .vrow>.vt{padding:8px 22px 8px 0}
 .cards,.cards:empty{display:grid;margin:0;padding:8px 0 8px 16px;border-left:1px solid var(--line);align-content:start}
 .shd,.stabs{padding-left:24px;padding-right:24px}
 .chips{padding-left:24px;padding-right:24px}
 .hint{margin-left:24px;margin-right:24px}
}
.m{border-radius:3px}
.k-hl{background:color-mix(in srgb,var(--mc) 34%,transparent)}
.k-cm{background:color-mix(in srgb,var(--mc) 15%,transparent);border-bottom:1.5px dotted var(--mc)}
.k-ul{text-decoration:underline;text-decoration-color:var(--mc);text-decoration-thickness:2px;text-underline-offset:4px}
.k-circ{border:1.6px solid var(--mc);border-radius:999px;padding:0 5px;margin:0 -1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.outline{padding:6px 20px 60px;max-width:760px;font-family:var(--serif);font-size:17px;line-height:1.6}
.outline h2,.outline h3,.outline h4{font-family:var(--ui);margin:18px 0 6px;line-height:1.3}
.outline h2{font-size:21px}.outline h3{font-size:17px}.outline h4{font-size:15px}
.outline ul,.outline ol{margin:4px 0;padding-left:22px}
.outline blockquote{margin:8px 0;padding-left:12px;border-left:2px solid var(--line2);color:var(--ink2)}
.outline mark{background:color-mix(in srgb,var(--c4) 40%,transparent);color:inherit;border-radius:3px}
@media (min-width:680px){.outline{padding-left:24px}}

#tool{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:20;display:none;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:8px 12px;box-shadow:0 6px 22px rgba(0,0,0,.22);max-width:calc(100% - 16px)}
#tool.show{display:flex}
@media (min-width:980px){#tool{bottom:calc(28px + env(safe-area-inset-bottom,0px))}}
.sw{width:27px;height:27px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line2);flex:none}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.dv{width:1px;height:22px;background:var(--line2);flex:none}
.tb2{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;color:var(--ink2);flex:none}
.tb2:active{background:var(--fill)}

#ed,#tx{position:fixed;z-index:30;display:none;background:var(--card);border:1px solid var(--line2);box-shadow:0 10px 32px rgba(0,0,0,.24);left:0;right:0;bottom:0;border-radius:18px 18px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:78vh;overflow:auto}
#ed.open,#tx.open{display:block}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 10px}
@media (min-width:680px){#ed,#tx{left:auto;right:18px;bottom:auto;top:calc(72px + env(safe-area-inset-top,0px));width:360px;border-radius:14px;padding:14px 16px;max-height:calc(100% - 100px)}.grab{display:none}}
.ew{color:var(--ink2);font:italic 15.5px/1.4 var(--serif);margin:0 0 10px}
.krow,.crow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.crow{gap:10px}
.kb{padding:6px 11px;border-radius:9px;background:var(--fill);font-size:13.5px;font-weight:500;color:var(--ink2)}
.kb.on{background:var(--tint);color:var(--accent);font-weight:600}
.ta{display:block;width:100%;min-height:84px;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font:15px/1.5 var(--ui);background:var(--paper);color:var(--ink);resize:vertical}
.trow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tagin{border:1px dashed var(--line2);border-radius:999px;padding:4px 10px;font:13px var(--ui);background:none;color:var(--ink);width:120px}
.efoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.del{color:var(--danger);font-weight:500;font-size:14px;display:flex;gap:6px;align-items:center}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 15px;border-radius:11px;font-size:14px;z-index:50;display:none;align-items:center;gap:14px;max-width:calc(100% - 32px)}
#toast.show{display:flex}
#toast button{font-weight:600;color:var(--paper);text-decoration:underline}
#about{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#about.open{display:flex}
#about .card{max-width:430px;width:100%;max-height:100%;overflow:auto}
#about p{margin:0 0 10px;font-size:14.5px;color:var(--ink2)}

.two{display:grid;gap:12px}
@media (min-width:680px){.two{grid-template-columns:1fr 1fr;align-items:start}}
.rr{font:600 26px/1.2 var(--serif)}
.prog{height:5px;border-radius:3px;background:var(--fill);margin:10px 0 6px}
.prog i{display:block;height:5px;border-radius:3px;background:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal .w{font-size:11.5px;color:var(--muted);padding:4px 0}
.dc{padding:2px 0;font-size:13.5px;color:var(--ink2);display:block;width:100%;text-align:center}
.dn{display:grid;place-items:center;width:32px;height:32px;margin:0 auto;border-radius:50%}
.dc.t .dn{box-shadow:0 0 0 1.5px var(--accent);color:var(--ink);font-weight:600}
.dc.f{color:var(--muted)}
.dot{display:block;width:5px;height:5px;border-radius:50%;margin:1px auto 0;background:var(--accent);visibility:hidden}
.dc.r .dot{visibility:visible}
.rec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line);width:100%;font-size:13.5px}
.rec:first-of-type{border-top:0}
.rec span:first-child{color:var(--muted)}
.rec span:last-child{font-family:var(--serif);font-size:15.5px}

.rd{display:grid}
.rdt{padding:16px 22px 24px;max-width:720px}
.rdt .vt{font-size:calc(20px*var(--tsz,1));line-height:var(--tlh,1.75)}
.rdw{padding:16px 22px 40px;border-top:1px solid var(--line);background:var(--panel)}
.rdw h4{font:600 14.5px var(--ui);margin:14px 0 2px}
.rdw p.h{margin:0 0 6px;font-size:13px;color:var(--muted);font-style:italic}
@media (min-width:980px){.rd{grid-template-columns:minmax(0,1fr) 400px;min-height:100%}.rdt{padding:24px 44px}.rdw{border-top:0;border-left:1px solid var(--line)}}

.res{display:block;width:100%;padding:11px 13px;border-radius:11px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.res b{font-size:13px;color:var(--muted);font-weight:500;display:block}
.res span{font-family:var(--serif);font-size:15.5px}
.res mark{background:color-mix(in srgb,var(--c4) 45%,transparent);color:inherit;border-radius:2px}
.qin{width:100%;border:1px solid var(--line2);border-radius:11px;padding:10px 12px;font:16px var(--ui);background:var(--paper);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <aside id="side" aria-label="Navigation"></aside>
 <main id="main">
  <header id="bar"></header>
  <div id="body"></div>
  <div id="foot" hidden></div>
  <nav id="tabs" aria-label="Sections"></nav>
 </main>
</div>
<div id="tool" role="toolbar" aria-label="Mark the selected words"></div>
<div id="ed" role="dialog" aria-label="Edit mark"></div>
<div id="tx" role="dialog" aria-label="Scripture text"></div>
<div id="toast" role="status"></div>
<div id="about" role="dialog" aria-label="About this demo"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;

 const hi=t=>{const i=t.toLowerCase().indexOf(q);if(i<0)return esc(t);const a=Math.max(0,i-50);return (a?'…':'')+esc(t.slice(a,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length,i+q.length+80))+(i+q.length+80<t.length?'…':'')};
 const out=[];
 D.studies.forEach(s=>{
  s.passages.forEach(p=>p.verses.forEach(([v,t])=>{if(t.toLowerCase().includes(q))out.push(`<button class="res" data-act="goto" data-s="${s.id}" data-p="${p.id}" data-v="${v}"><b>${esc(s.title)} · ${esc(p.ref.split(':')[0])}:${v}</b><span>${hi(t)}</span></button>`)}));
  s.marks.forEach(m=>{if((m.note+' '+m.tags.join(' ')).toLowerCase().includes(q))out.push(`<button class="res" data-act="goto" data-s="${s.id}" data-p="${m.p}" data-v="${m.v}"><b>Note in ${esc(s.title)}, verse ${m.v}</b><span>${hi(plainMd(m.note)||m.tags.map(t=>'#'+t).join(' '))}</span></button>`)});
  s.outline.split('\n').forEach(l=>{if(l.toLowerCase().includes(q))out.push(`<button class="res" data-act="gonotes" data-s="${s.id}"><b>Study notes, ${esc(s.title)}</b><span>${hi(l.replace(/^[#>*\-\s]+/,''))}</span></button>`)});
 });
 Object.entries(D.devo.log).forEach(([k,e])=>{const t=Object.values(e.f).map(plainMd).join(' ');if((e.ref+' '+t).toLowerCase().includes(q))out.push(`<button class="res" data-act="day" data-d="${k}"><b>Devotional, ${kdate(k).toLocaleDateString('en-US',{month:'short',day:'numeric'})} · ${esc(e.ref)}</b><span>${hi(t||e.ref)}</span></button>`)});
 return out.length?`<p class="muted" style="font-size:13px;margin:4px 2px 8px">${out.length} found</p>`+out.join(''):'<p class="muted" style="font-size:14px">Nothing found.</p>';
}
function todayRead(){const t=new Date();return READ[(dayIdx(t)+ui.another)%READ.length]}
function vDevo(){
 const t=new Date(),tk=dkey(t),log=D.devo.log,done=log[tk];
 if(!ui.cal)ui.cal=[t.getFullYear(),t.getMonth()];
 const [cy,cm]=ui.cal;const r=done?READ.find(x=>x.ref===done.ref)||todayRead():todayRead();
 const today=`<div class="card"><div class="lbl">Today</div><div class="rr">${esc(r.ref)}</div><div class="muted" style="font-size:13px;margin:2px 0 12px">${r.vs.length} verses · WEB${done?' · read today':''}</div><div style="display:flex;gap:8px;flex-wrap:wrap">${done?`<button class="btn" data-act="day" data-d="${tk}">${ic('check',15)}Open today’s notes</button>`:`<button class="btn" data-act="start">Start reading</button><button class="btn2" data-act="another">Another</button>`}</div></div>`;
 const n=Object.keys(log).length;
 const plan=`<div class="card"><div class="lbl">Plan</div><div style="font-weight:600;font-size:16px">Surprise me</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${['Psalms','Gospels','Epistles'].map(p=>`<span class="chip on">${p}</span>`).join('')}</div><div class="prog"><i style="width:${Math.min(100,n*2)}%"></i></div><div style="display:flex;justify-content:space-between;font-size:13px" class="muted"><span>${n} readings so far</span><button style="color:var(--accent);font-weight:500" data-act="plan">Change plan</button></div></div>`;
 const first=new Date(cy,cm,1),days=new Date(cy,cm+1,0).getDate();
 let cal=`<div class="cal">${['S','M','T','W','T','F','S'].map(d=>`<div class="w">${d}</div>`).join('')}${'<div></div>'.repeat(first.getDay())}`;
 for(let d=1;d<=days;d++){const k=`${cy}-${pad(cm+1)}-${pad(d)}`;const dd=new Date(cy,cm,d);cal+=`<button class="dc${k===tk?' t':''}${dd>t?' f':''}${log[k]?' r':''}" data-act="day" data-d="${k}" aria-label="${dd.toDateString()}${log[k]?', read':''}"><span class="dn">${d}</span><i class="dot"></i></button>`}
 cal+='</div>';
 const calc=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font-weight:600">${first.toLocaleString('en-US',{month:'long',year:'numeric'})}</b><span style="display:flex;gap:2px"><button class="ib" data-act="cal" data-d="-1" aria-label="Previous month">${ic('chevL',16)}</button><button class="ib" data-act="cal" data-d="1" aria-label="Next month">${ic('chevR',16)}</button></span></div>${cal}</div>`;
 const rec=Object.entries(log).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,5);
 const recent=`<div class="card"><div class="lbl">Recent</div>${rec.length?rec.map(([k,e])=>`<button class="rec" data-act="day" data-d="${k}"><span>${kdate(k).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</span><span>${esc(e.ref)}</span></button>`).join(''):'<p class="muted">No readings yet.</p>'}</div>`;
 return {bar:`<div class="bt">Devotional</div><span class="sp"></span><button class="ib" data-act="about" aria-label="About this demo">${ic('info')}</button>`,body:`<div class="pg"><div class="two">${today}${plan}</div><div class="two">${calc}${recent}</div></div>`};
}

 const dl=kdate(dr.date).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
 const fields=tp.f.map(([k,l,h])=>`<h4>${l}</h4><p class="h">${h}</p>${fmtBar('df-'+k)}<textarea class="ta" id="df-${k}" data-f="${k}" aria-label="${l}">${esc(dr.f[k]||'')}</textarea>`).join('');
 return {bar:`<button class="back" data-act="nav" data-v="devo">${ic('chevL',18)}Devotional</button><span class="sp"></span><span class="muted" style="font-size:13px">${dl}</span><button class="ib aa" data-act="txt" aria-label="Scripture text settings" title="Scripture text">Aa</button>`,
  body:`<div class="rd"><div class="rdt"><div class="ser">Surprise me · ${esc(r.pool)}</div><div class="rr" style="font-size:30px">${esc(r.ref)}</div><div class="muted" style="font-size:13px;margin-bottom:14px">WEB · ${r.vs.length} verses</div>${readHtml(r)}</div><div class="rdw"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="lbl" style="margin:0">Your notes</span><div class="seg">${Object.entries(TPL).map(([k,t])=>`<button class="${dr.tpl===k?'on':''}" data-act="tpl" data-t="${k}">${t.n}</button>`).join('')}</div></div>${fields}<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn" data-act="ddone">${ic('check',15)}Done</button></div></div></div>`};

/* ---------- marking ---------- */
function toolHtml(){
 return `${[1,2,3,4,5,6].map(c=>`<button class="sw${ui.color===c?' on':''}" style="background:var(--c${c})" data-act="tool" data-k="hl" data-c="${c}" aria-label="Highlight, color ${c}"></button>`).join('')}<span class="dv"></span><button class="tb2" data-act="tool" data-k="ul" aria-label="Underline">${ic('underline',19)}</button><button class="tb2" data-act="tool" data-k="circ" aria-label="Circle">${ic('circle',19)}</button><button class="tb2" data-act="tool" data-k="cm" aria-label="Comment">${ic('note',19)}</button>`;
}
const tool=$('#tool');tool.innerHTML=toolHtml();
tool.addEventListener('pointerdown',e=>e.preventDefault());
tool.addEventListener('mousedown',e=>e.preventDefault());
let selT=0;
document.addEventListener('selectionchange',()=>{clearTimeout(selT);selT=setTimeout(readSel,120)});
const vtxOf=n=>{const el=n&&(n.nodeType===3?n.parentElement:n);return el&&el.closest?el.closest('.vtx'):null};
function offIn(root,node,off){const r=document.createRange();r.setStart(root,0);r.setEnd(node,off);return r.toString().length}
let warned=false;
function readSel(){
 if(ui.view!=='study'||!ui.mark||ui.edit){tool.classList.remove('show');return}
 const s=getSelection();if(!s||!s.rangeCount||s.isCollapsed){ui.sel=null;tool.classList.remove('show');return}
 const r=s.getRangeAt(0),a=vtxOf(r.startContainer),b=vtxOf(r.endContainer);
 if(!a||a!==b){ui.sel=null;tool.classList.remove('show');if((a||b)&&!warned){warned=true;toast('Select words within one verse')}return}
 const txt=a.textContent;let st=offIn(a,r.startContainer,r.startOffset),en=offIn(a,r.endContainer,r.endOffset);
 while(st<en&&/\s/.test(txt[st]))st++;while(en>st&&/[\s,.;:!?]/.test(txt[en-1]))en--;
 if(en<=st){ui.sel=null;tool.classList.remove('show');return}
 ui.sel={p:a.dataset.p,v:+a.dataset.v,s:st,e:en,w:txt.slice(st,en)};
 tool.innerHTML=toolHtml();tool.classList.add('show');
}
function applyMark(kind,color){
 const sl=ui.sel;if(!sl)return;const st=cur();
 if(color)ui.color=color;
 const m={id:uid(),p:sl.p,v:sl.v,s:sl.s,e:sl.e,w:sl.w,kind,color:ui.color,note:'',tags:[]};
 st.marks.push(m);st.updated=Date.now();save();
 try{getSelection().removeAllRanges()}catch(e){}
 ui.sel=null;tool.classList.remove('show');ui.edit=m.id;render();
 const n=$('#enote');if(n&&kind!=='hl')n.focus();
}
function renderEd(){
 const ed=$('#ed');const [,m]=ui.edit?findMark(ui.edit):[null,null];
 if(!m){ed.classList.remove('open');ed.innerHTML='';return}
 const tags=allTags();
 ed.innerHTML=`<div class="grab"></div><p class="ew">“${esc(m.w)}”</p><div class="krow">${['hl','ul','circ','cm'].map(k=>`<button class="kb${m.kind===k?' on':''}" data-act="ekind" data-k="${k}">${KN[k]}</button>`).join('')}</div><div class="crow">${[1,2,3,4,5,6].map(c=>`<button class="sw${m.color===c?' on':''}" style="background:var(--c${c})" data-act="ecolor" data-c="${c}" aria-label="Color ${c}"></button>`).join('')}</div>${fmtBar('enote')}<textarea class="ta" id="enote" placeholder="Note (tap the microphone on the keyboard to dictate)">${esc(m.note)}</textarea><div class="trow">${tags.map(t=>`<button class="chip${m.tags.includes(t)?' on':''}" data-act="etag" data-t="${esc(t)}">#${esc(t)}</button>`).join('')}<input class="tagin" id="etagin" placeholder="+ new tag" enterkeyhint="done" autocomplete="off"></div><div class="efoot"><button class="del" data-act="edel">${ic('trash',16)}Delete mark</button><button class="btn" data-act="edone">Done</button></div>`;
 ed.classList.add('open');$('#tx').classList.remove('open');
}
function closeEd(){ui.edit=null;render()}
function markTap(id){
 if(ui.mark){ui.edit=id;render();return}
 const [,m]=findMark(id);
 if(m&&(m.note||m.tags.length)){ui.flash=id;render();const c=document.getElementById('c-'+id);if(c)c.scrollIntoView({block:'nearest',behavior:'smooth'});setTimeout(()=>{ui.flash=null;const e=document.getElementById('c-'+id);if(e)e.classList.remove('flash')},1600)}
 else{ui.edit=id;render()}
}

const FONTS=[['source','Source Serif','"Source Serif 4",Georgia,serif'],['literata','Literata','Literata,Georgia,serif'],['georgia','Georgia','Georgia,"Times New Roman",serif'],['charter','Charter','Charter,"Bitstream Charter","Iowan Old Style",Georgia,serif'],['palatino','Palatino','Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif'],['sans','Sans serif','Inter,system-ui,-apple-system,sans-serif']];
const LH=[['1.5','Tight'],['1.75','Normal'],['2','Relaxed'],['2.3','Airy']];
const TDEF={font:'source',size:1,lh:'1.75',vn:true,layout:'verse'};
const tset=()=>Object.assign({},TDEF,D.set.text||{});
function applyText(){const t=tset(),r=document.documentElement.style,f=FONTS.find(x=>x[0]===t.font)||FONTS[0];r.setProperty('--sfont',f[2]);r.setProperty('--tsz',t.size);r.setProperty('--tlh',t.lh);$('#app').classList.toggle('novn',!t.vn);$('#tx').classList.toggle('novn',!t.vn)}

 plan:()=>toast('Choosing a plan comes in a later build'),
 cal:el=>{let [y,m]=ui.cal;m+=+el.dataset.d;if(m<0){m=11;y--}if(m>11){m=0;y++}ui.cal=[y,m];render()},
 day:el=>{const k=el.dataset.d,tk=dkey(new Date());if(D.devo.log[k])startRead(k);else if(k===tk)startRead(tk,todayRead().ref);else toast(kdate(k)>new Date()?'That day hasn’t come yet':'No reading that day')},
 tpl:el=>{ui.dr.tpl=el.dataset.t;render()},
 ddone:()=>{const dr=ui.dr;const f={};Object.entries(dr.f).forEach(([k,v])=>{if(String(v).trim())f[k]=v});D.devo.log[dr.date]={ref:dr.ref,tpl:dr.tpl,f,t:Date.now()};save();ui.view='devo';render();toast('Saved')},
 goto:el=>{ui.sid=el.dataset.s;ui.view='study';ui.tab='passage';ui.filter='all';ui.mark=false;ui.flashV=el.dataset.p+'-'+el.dataset.v;lastKey='';render()},
 gonotes:el=>{ui.sid=el.dataset.s;ui.view='study';ui.tab='notes';ui.mark=false;lastKey='';render()},
};
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');
 if(a){if(a.disabled)return;const f=A[a.dataset.act];if(f){f(a,e);return}}
 const m=e.target.closest('.vtx [data-m]');
 if(m){const s=getSelection();if(s&&!s.isCollapsed&&ui.mark)return;markTap(m.dataset.m);return}
 if(e.target.id==='about')$('#about').classList.remove('open');
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='enote'){const [s,m]=findMark(ui.edit);if(m){m.note=t.value;s.updated=Date.now();save()}}
 else if(t.id==='q'){ui.q=t.value;$('#res').innerHTML=results()}
 else if(t.id==='tsz'){D.set.text=Object.assign(tset(),{size:+t.value});save();applyText();$('#tszv').textContent=Math.round(t.value*100)+'%'}
 else if(t.dataset&&t.dataset.f&&ui.dr){ui.dr.f[t.dataset.f]=t.value}
});
document.addEventListener('keydown',e=>{
 if(e.target.id==='etagin'&&e.key==='Enter'){e.preventDefault();const v=e.target.value.trim().toLowerCase().replace(/^#/,'').replace(/\s+/g,'-');if(!v)return;const [s,m]=findMark(ui.edit);if(m&&!m.tags.includes(v)){m.tags.push(v);s.updated=Date.now();save()}render();return}
 if(e.key==='Escape'){if($('#tx').classList.contains('open')){$('#tx').classList.remove('open');return}if($('#about').classList.contains('open'))$('#about').classList.remove('open');else if(ui.edit)closeEd();return}
 if((e.ctrlKey||e.metaKey)&&e.target.tagName==='TEXTAREA'&&['b','i'].includes(e.key.toLowerCase())){e.preventDefault();fmtText(e.target,e.key.toLowerCase());return}
 if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('nc')){A.card(e.target)}
});
document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('.fbar'))e.preventDefault()});
document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('.fbar'))e.preventDefault()});
if(window.visualViewport){const vv=visualViewport;const fit=()=>{const ed=$('#ed');if(innerWidth<680){ed.style.bottom=Math.max(0,innerHeight-vv.height-vv.offsetTop)+'px'}else ed.style.bottom=''};vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit)}
WIDE.addEventListener('change',()=>render());
applyTheme();applyText();render();
document.addEventListener('change',async e=>{
 if(e.target.id!=='rfile'||!e.target.files[0])return;
 try{const f=e.target.files[0];const txt=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsText(f)});const x=JSON.parse(txt);if(x.v!==1||!Array.isArray(x.studies)||!x.devo)throw 0;D=x;save();applyTheme();applyText();Object.assign(ui,{sid:D.studies[0].id,edit:null,mark:false,filter:'all',dr:null});$('#about').classList.remove('open');ui.view=WIDE.matches?'study':'studies';render();toast('Restored from backup')}
 catch(err){toast('That file isn’t a Marginalia backup')}
 e.target.value='';
});
if('serviceWorker' in navigator&&location.protocol==='https:'){
 addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>{r.addEventListener('updatefound',()=>{const n=r.installing;if(n)n.addEventListener('statechange',()=>{if(n.state==='activated'&&navigator.serviceWorker.controller)toast('A new version is ready',()=>location.reload(),'Reload')})})}).catch(()=>{})});
}
</script>
</body>
</html>
